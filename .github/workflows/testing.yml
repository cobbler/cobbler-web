name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-typescript-xmlrpc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: NPM CI
        run: npm ci
      - name: Build project typescript-xmlrpc
        run: npm run build typescript-xmlrpc
      - name: Test Project
        run: npm run test:ci typescript-xmlrpc
      - name: Upload coverage report to GH artifacts
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-typescript-xmlrpc
          path: coverage/typescript-xmlrpc/lcov.info
          if-no-files-found: error
  unit-cobbler-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: NPM CI
        run: npm ci
      - name: Build sibling project typescript-xmlrpc
        run: npm run build typescript-xmlrpc
      - name: Build project cobbler-api
        run: npm run build cobbler-api
      - name: Test Project
        run: npm run test:ci cobbler-api
      - name: Upload coverage report to GH artifacts
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-cobbler-api
          path: coverage/cobbler-api/lcov.info
          if-no-files-found: error
  unit-cobbler-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: NPM CI
        run: npm ci
      - name: Build sibling project typescript-xmlrpc
        run: npm run build typescript-xmlrpc
      - name: Build sibling project cobbler-api
        run: npm run build cobbler-api
      - name: Build project (all locales)
        run: npm run build cobbler-frontend --configuration=production
      - name: Test Project
        run: npm run test:ci cobbler-frontend
      - name: Upload coverage report to GH artifacts
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-cobbler-frontend
          path: coverage/cobbler-frontend/lcov.info
          if-no-files-found: error
  e2e-cobbler-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        # https://github.com/actions/setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
      - name: NPM CI
        run: npm ci
      - name: Build sibling project typescript-xmlrpc
        run: npm run build typescript-xmlrpc
      - name: Build sibling project cobbler-api
        run: npm run build cobbler-api
      - name: Install Playwright browsers
        run: npm run e2e:install
      - name: Start Cobbler backend
        # Pulls tagged images directly (e2e/compose.yml: Traefik + cobblerd + http-api +
        # cobbler-tftp) rather than checking out and building the backend repo's own compose
        # stack - was pinned to the pre-4.0.0 "release33" branch via a bespoke
        # apache2+supervisord dev container that predates the whole 4.0.0 rewrite this frontend
        # now targets, so it could never catch a regression in 4.x-only backend behavior (e.g.
        # the get_item/get_<type> uid requirement). Matches how cobbler-cli and
        # terraform-provider-cobbler pin their own live-backend tests to a real tagged release,
        # while staying as close to the backend's real production topology as practical.
        run: COBBLER_IMAGE_TAG=v4.0.0b5 docker compose -f e2e/compose.yml up -d
      - name: Wait for Cobbler XML-RPC API to be ready
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/cobbler_api || echo "000")
            if [ "$code" != "000" ]; then
              echo "Cobbler API is up (HTTP $code)"
              exit 0
            fi
            echo "Waiting for Cobbler API... ($i)"
            sleep 2
          done
          echo "Cobbler API did not become ready in time"
          docker compose -f e2e/compose.yml logs
          exit 1
      - name: Seed a fake kernel/initrd for the Distro create fixture
        # cobbler/items/distro.py requires kernel/initrd to already exist as real files - the
        # e2e distro fixture points at /code/system-tests/images/fake/{vmlinuz,initramfs}
        # (the same placeholder path Cobbler's own system-tests ship), which only exists in a
        # full source checkout, not this bare published image - so create empty stand-ins.
        run: |
          docker compose -f e2e/compose.yml exec -u root -T cobblerd sh -c \
            "mkdir -p /code/system-tests/images/fake && touch /code/system-tests/images/fake/vmlinuz /code/system-tests/images/fake/initramfs"
      - name: E2E Tests
        run: npm run e2e:ci
      - name: Upload Playwright report on failure
        if: failure()
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Stop and remove Cobbler backend
        if: always()
        run: docker compose -f e2e/compose.yml down -v
